basePath: /api/v1
definitions:
  application.AggRequest:
    properties:
      after:
        additionalProperties: true
        description: 分页游标
        type: object
      search:
        description: 下拉框搜索词
        type: string
      size:
        description: 每页条数（可选，覆盖配置默认值）
        type: integer
    type: object
  application.AggResult:
    properties:
      after:
        additionalProperties: true
        description: 下一页游标
        type: object
      avg:
        type: number
      buckets:
        description: terms/composite 聚合
        items:
          $ref: '#/definitions/application.Bucket'
        type: array
      hasMore:
        description: 是否有更多
        type: boolean
      max:
        type: number
      min:
        description: stats 聚合
        type: number
    type: object
  application.Bucket:
    properties:
      docCount:
        type: integer
      key: {}
    type: object
  application.IndexListResponse:
    properties:
      indices:
        items:
          type: string
        type: array
    type: object
  application.LoginRequest:
    properties:
      loginId:
        type: string
      password:
        minLength: 3
        type: string
    required:
    - loginId
    - password
    type: object
  application.LoginResponse:
    properties:
      accessToken:
        description: 改为小驼峰
        type: string
      department:
        description: 部门信息
        type: string
      refreshToken:
        description: 新增
        type: string
      requirePasswordChange:
        description: 改为小驼峰
        type: boolean
      role:
        description: 扁平化，直接返回角色
        type: string
      username:
        description: 扁平化，直接返回用户名
        type: string
    type: object
  application.PaginationRequest:
    properties:
      offset:
        type: integer
      size:
        description: 最大 100 条
        maximum: 100
        type: integer
    type: object
  application.RefreshTokenRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  application.RefreshTokenResponse:
    properties:
      accessToken:
        type: string
    type: object
  application.SearchRequest:
    properties:
      aggRequests:
        additionalProperties:
          $ref: '#/definitions/application.AggRequest'
        description: 聚合请求
        type: object
      filters:
        additionalProperties: true
        description: 筛选条件
        type: object
      index:
        description: clients, suppliers, orders, etc.
        type: string
      pagination:
        $ref: '#/definitions/application.PaginationRequest'
      query:
        description: 全文搜索关键词
        type: string
      searchFields:
        description: 指定搜索字段（可选，默认使用配置的queryFields）
        items:
          type: string
        type: array
      sort:
        items:
          $ref: '#/definitions/application.SortRequest'
        type: array
    required:
    - index
    type: object
  application.SearchResponse:
    properties:
      aggregations:
        additionalProperties:
          $ref: '#/definitions/application.AggResult'
        description: 聚合结果
        type: object
      items:
        description: 搜索结果
        items:
          additionalProperties: true
          type: object
        type: array
      took:
        description: 耗时 (ms)
        type: integer
      total:
        description: 总条数
        type: integer
    type: object
  application.SortRequest:
    properties:
      field:
        type: string
      order:
        description: asc, desc
        type: string
    type: object
info:
  contact: {}
  description: 后台管理系统的API文档
  title: 后台管理系统 API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 通过登录ID和密码进行用户认证
      parameters:
      - description: 登录请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/application.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 请求参数错误
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 用户登录
      tags:
      - 认证
  /auth/logout:
    post:
      consumes:
      - application/json
      description: 用户登出（清除 JWT 白名单）
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 用户登出
      tags:
      - 认证
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用 Refresh Token 获取新的 Access Token
      parameters:
      - description: Refresh Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/application.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token 无效
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 刷新访问令牌
      tags:
      - 认证
  /search:
    post:
      consumes:
      - application/json
      description: 基于配置的高级搜索，支持全文搜索、筛选、聚合
      parameters:
      - description: 搜索请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/application.SearchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 搜索结果
          schema:
            $ref: '#/definitions/application.SearchResponse'
        "400":
          description: 请求参数错误
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: 搜索
      tags:
      - 搜索
  /search/indices:
    get:
      consumes:
      - application/json
      description: 获取所有支持搜索的索引列表
      produces:
      - application/json
      responses:
        "200":
          description: 索引列表
          schema:
            $ref: '#/definitions/application.IndexListResponse'
      security:
      - Bearer: []
      summary: 获取索引列表
      tags:
      - 搜索
securityDefinitions:
  Bearer:
    description: 请输入 Bearer {token}
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
