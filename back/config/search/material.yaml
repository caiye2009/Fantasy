# Material 搜索配置
# 字段定义以 internal/material/domain/material.go 为准

index: material

# 全文搜索字段（按优先级排序）
queryFields:
  - field: materialName
    boost: 5.0
  - field: materialCode
    boost: 4.0
  - field: materialCategory
    boost: 2.0

# 过滤字段（type 自动从 Domain 推断）
filterFields:
  - field: id
    operator: term
  - field: materialCode
    operator: term
  - field: materialName
    operator: match
  - field: materialCategory
    operator: term
  - field: createdBy
    operator: term
  - field: createdAt
    operator: range
  - field: updatedAt
    operator: range

# 聚合字段（用于下拉筛选器）
aggregationFields:
  - field: materialCategory
    aggType: terms
    size: 50
    supportSearch: true
  - field: createdBy
    aggType: terms
    size: 50
    supportSearch: true

# 默认排序
defaultSort:
  - field: createdAt
    order: desc
