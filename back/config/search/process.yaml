# Process 搜索配置
# 字段定义以 internal/process/domain/process.go 为准

index: process

# 全文搜索字段（按优先级排序）
queryFields:
  - field: processName
    boost: 5.0
  - field: processCode
    boost: 4.0
  - field: processCountry
    boost: 2.0

# 过滤字段（type 自动从 Domain 推断）
filterFields:
  - field: id
    operator: term
  - field: processCode
    operator: term
  - field: processName
    operator: match
  - field: processCountry
    operator: term
  - field: createdBy
    operator: term
  - field: createdAt
    operator: range
  - field: updatedAt
    operator: range

# 聚合字段（用于下拉筛选器）
aggregationFields:
  - field: processCountry
    aggType: terms
    size: 50
    supportSearch: true
  - field: createdBy
    aggType: terms
    size: 50
    supportSearch: true

# 默认排序
defaultSort:
  - field: createdAt
    order: desc
