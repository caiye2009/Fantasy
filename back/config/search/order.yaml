# Order 搜索配置
# 字段定义以 internal/order/domain/order.go 为准

index: order

# 全文搜索字段（按优先级排序）
queryFields:
  - field: orderCode
    boost: 5.0
  - field: clientCode
    boost: 3.0
  - field: orderStatus
    boost: 2.0

# 过滤字段（type 自动从 Domain 推断）
filterFields:
  - field: id
    operator: term
  - field: orderCode
    operator: term
  - field: clientCode
    operator: term
  - field: orderStatus
    operator: terms
  - field: orderDate
    operator: range
  - field: deliveryDate
    operator: range
  - field: createdBy
    operator: term
  - field: createdAt
    operator: range
  - field: updatedAt
    operator: range

# 聚合字段（用于下拉筛选器）
aggregationFields:
  - field: orderStatus
    aggType: terms
    size: 20
    supportSearch: false
  - field: clientCode
    aggType: terms
    size: 50
    supportSearch: true
  - field: createdBy
    aggType: terms
    size: 50
    supportSearch: true

# 默认排序
defaultSort:
  - field: createdAt
    order: desc
