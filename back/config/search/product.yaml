# Product 搜索配置
# 字段定义以 internal/product/domain/product.go 为准

index: product

# 全文搜索字段（按优先级排序）
queryFields:
  - field: productName
    boost: 5.0
  - field: productCode
    boost: 4.0

# 过滤字段（type 自动从 Domain 推断）
filterFields:
  - field: id
    operator: term
  - field: productCode
    operator: term
  - field: productName
    operator: match
  - field: createdBy
    operator: term
  - field: createdAt
    operator: range
  - field: updatedAt
    operator: range

# 聚合字段（用于下拉筛选器）
aggregationFields:
  - field: createdBy
    aggType: terms
    size: 50
    supportSearch: true

# 默认排序
defaultSort:
  - field: createdAt
    order: desc
